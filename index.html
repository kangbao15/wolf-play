<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KangBao Games</title>
  <link rel="icon" type="image/png" href="Screenshot%202026-10-11%20103624.png">
<style>
  :root{
    --bg:#19121f;
    --panel:#241a2e;
    --card:#2d2039;
    --card-hover:#3a2a4a;
    --text:#f1e9f7;
    --muted:#a593b5;
    --accent:#ff2fd6;
    --accent2:#9d4edd;
    --accent-dim:#3a1950;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;
  }

  /* ---- sidebar ---- */
  aside{
    width:220px;
    flex-shrink:0;
    background:var(--panel);
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    border-right:1px solid #000;
  }
  .brand{
    font-size:1.25rem;
    font-weight:700;
    margin:0 0 20px 4px;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .mode-btn{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--muted);
    text-align:left;
    font-size:0.95rem;
    padding:11px 14px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s,color .15s;
  }
  .mode-btn:hover{background:var(--card);color:var(--text);}
  .mode-btn.active{background:var(--accent-dim);color:var(--accent);font-weight:600;box-shadow:0 0 12px -3px var(--accent);}

  .sidebar-foot{
    margin-top:auto;
    font-size:0.78rem;
    color:var(--muted);
    padding:0 4px;
  }
  .sidebar-foot b{color:var(--text);}

  /* ---- main ---- */
  main{
    flex:1;
    padding:32px 36px;
    max-width:1100px;
  }
  h1{
    font-size:1.4rem;
    margin:0 0 4px;
  }
  .sub{
    color:var(--muted);
    font-size:0.9rem;
    margin:0 0 26px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:18px;
  }
  .game-card{
    background:var(--card);
    border-radius:16px;
    padding:0;
    overflow:hidden;
    cursor:pointer;
    text-decoration:none;
    color:var(--text);
    display:block;
    transition:background .15s,transform .1s;
    position:relative;
  }
  .game-card:hover{background:var(--card-hover);transform:translateY(-2px);box-shadow:0 0 18px -4px var(--accent);}
  .thumb{
    width:100%;
    aspect-ratio:1/1;
    background:linear-gradient(135deg,var(--accent-dim),var(--accent2) 160%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.1rem;
  }
  .card-info{padding:10px 12px 14px;}
  .card-title{font-size:0.92rem;font-weight:600;margin:0 0 3px;}
  .card-tag{font-size:0.72rem;color:var(--muted);}
  .played-badge{
    position:absolute;
    top:8px;
    right:8px;
    background:rgba(0,0,0,.55);
    color:var(--accent);
    font-size:0.68rem;
    padding:3px 7px;
    border-radius:20px;
  }

  .empty{
    color:var(--muted);
    font-size:0.9rem;
    padding:40px 0;
    text-align:center;
  }
</style>
</head>
<body>

<aside>
  <p class="brand">KangBao Games</p>
  <button class="mode-btn active" data-mode="all">Tất cả</button>
  <button class="mode-btn" data-mode="single">Chơi 1 người</button>
  <button class="mode-btn" data-mode="multi">Chơi 2 người (cùng máy)</button>
  <div class="sidebar-foot">Đang chơi: <b id="recent-name">chưa có</b></div>
</aside>

<main>
  <h1>Chọn game</h1>
  <p class="sub">Tiến trình và lịch sử chơi được lưu ngay trên trình duyệt này.</p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" style="display:none;">Chưa có game nào ở mục này.</p>
</main>

<script>
  // Mỗi game: file html, tên hiển thị, chế độ (single / multi), icon tạm
  const GAMES = [
    { file: "strongwolf.html",      name: "StrongWolf",      mode: "single", icon: "🐺" },
    { file: "wolf-flappy.html",     name: "Wolf Flappy",     mode: "single", icon: "🦇" },
    { file: "Fruit-slicing.html",   name: "Fruit Slicing",   mode: "single", icon: "🍉" },
    { file: "death-race.html",      name: "Death Race",      mode: "single", icon: "🏎️" },
    { file: "steal-a-wolf-egg.html", name: "Steal a wolf egg", mode: "single", icon: "🐺🥚" },
    { file: "angry-wolf.html", name: "Angry Wolf", mode: "single", icon: "Y🐺"},
    { file: "tag-fake.html",        name: "Tag Fake",        mode: "multi",  icon: "🏃" },
    { file: "tug-of-war.html",      name: "Tug of War",      mode: "multi",  icon: "🪢" },
    { file: "dodge-meteorite.html", name: "Dodge Meteorite", mode: "multi", icon: "☄️" },
    { file: "bow-pvp.html", name: "Bow PvP", mode: "multi", icon: "🏹" },
    { file: "labyrinth-wolf.html", mode: "single", name: "Labyrinth Wolf", icon: "🌀" },
    { file: "wolf-hacker.html", mode: "single", name: "Wolf Hacker", icon: "🐺💻"},
  ];

  const STORAGE_KEY = "kangbao_game_history";

  function getHistory(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function markPlayed(file){
    const h = getHistory();
    h[file] = Date.now();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); }catch(e){}
  }

  const grid = document.getElementById("grid");
  const emptyMsg = document.getElementById("empty");
  const recentName = document.getElementById("recent-name");
  let currentMode = "all";

  function render(){
    const history = getHistory();
    const list = GAMES.filter(g => currentMode === "all" || g.mode === currentMode);
    grid.innerHTML = "";
    emptyMsg.style.display = list.length ? "none" : "block";

    list.forEach(g => {
      const a = document.createElement("a");
      a.href = g.file;
      a.className = "game-card";
      a.addEventListener("click", () => markPlayed(g.file));

      const played = history[g.file];
      a.innerHTML = `
        ${played ? '<span class="played-badge">Đã chơi</span>' : ""}
        <div class="thumb">${g.icon}</div>
        <div class="card-info">
          <p class="card-title">${g.name}</p>
          <p class="card-tag">${g.mode === "multi" ? "2 người · cùng máy" : "1 người"}</p>
        </div>`;
      grid.appendChild(a);
    });

    // most recently played, for the sidebar footer
    const entries = Object.entries(history).sort((a,b) => b[1]-a[1]);
    if(entries.length){
      const g = GAMES.find(x => x.file === entries[0][0]);
      recentName.textContent = g ? g.name : entries[0][0];
    }
  }

  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentMode = btn.dataset.mode;
      render();
    });
  });

  render();
</script>

</body>
</html>
