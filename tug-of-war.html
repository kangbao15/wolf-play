<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tug of War</title>
<style>
  :root{
    --bg:#160f1f;
    --panel:#231530;
    --panel2:#2e1c3f;
    --text:#f3ecf7;
    --muted:#b09cc2;
    --accent:#ff2fd6;
    --accent2:#9d4edd;
    --accent-dim:#3a1950;
    --p1:#4da6ff;
    --p2:#ff2fd6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI",system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    flex-direction:column;
    gap:14px;
    user-select:none;
  }
  h1{
    font-size:1.5rem;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .panel{
    background:var(--panel);
    border-radius:16px;
    padding:28px 34px;
    width:440px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .row-label{font-size:0.85rem;color:var(--muted);margin-bottom:6px;}
  .choice-group{display:flex;gap:8px;}
  .choice-btn{
    flex:1;
    background:var(--panel2);
    border:2px solid transparent;
    color:var(--text);
    padding:10px 6px;
    border-radius:10px;
    cursor:pointer;
    font-size:0.85rem;
  }
  .choice-btn.active{border-color:var(--accent);background:var(--accent-dim);color:#ffa8f0;box-shadow:0 0 12px -3px var(--accent);}
  .start-btn{
    margin-top:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#1a0f26;
    border:none;
    padding:12px;
    border-radius:10px;
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    box-shadow:0 0 16px -4px var(--accent);
  }
  .controls-hint{font-size:0.78rem;color:var(--muted);max-width:420px;text-align:center;line-height:1.5;}

  /* ---- main menu tiles ---- */
  #setup{width:520px;}
  .menu-art{
    display:flex; align-items:center; justify-content:center; gap:14px;
    font-size:2.2rem; padding:6px 0 2px;
  }
  .menu-art .rope-line{
    flex:1; height:4px; border-radius:4px;
    background:repeating-linear-gradient(90deg,#caa968 0 10px,#8a6a3f 10px 14px);
  }
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mode-tile{
    position:relative; border:none; border-radius:14px;
    padding:18px 14px 14px; min-height:120px;
    display:flex; flex-direction:column; justify-content:flex-end; gap:4px;
    overflow:hidden; cursor:pointer; color:#fff; text-align:left;
    transition:transform .15s, box-shadow .15s;
  }
  .mode-tile:hover{transform:translateY(-3px);}
  .mode-tile .tile-icon{position:absolute;top:10px;right:12px;font-size:1.8rem;opacity:0.55;}
  .mode-tile .tile-title{font-weight:800;font-size:1rem;text-shadow:0 1px 4px rgba(0,0,0,.4);}
  .mode-tile .tile-sub{font-size:0.7rem;color:rgba(255,255,255,0.88);}
  .tile-pvp{background:linear-gradient(160deg,#4da6ff,#0e3a66);}
  .tile-pvp.active{box-shadow:0 0 0 3px #4da6ff, 0 0 18px -2px #4da6ff;}
  .tile-bot{background:linear-gradient(160deg,#ff2fd6,#5a0f52);}
  .tile-bot.active{box-shadow:0 0 0 3px #ff2fd6, 0 0 18px -2px #ff2fd6;}

  #gameWrap{display:none;flex-direction:column;align-items:center;gap:10px;}
  #hud{display:flex;justify-content:space-between;align-items:center;width:800px;gap:14px;}
  .hud-side{flex:1;display:flex;flex-direction:column;gap:4px;}
  .hud-side.right{align-items:flex-end;}
  .hud-name{font-weight:700;font-size:0.95rem;}
  .power-bar{width:100%;height:10px;background:#1a1222;border-radius:6px;overflow:hidden;}
  .power-fill{height:100%;width:0%;transition:width .06s linear;}
  #hudCenter{text-align:center;font-weight:700;font-size:1.1rem;min-width:80px;}
  #pauseBtn{
    background:var(--panel2); color:var(--text); border:none;
    padding:6px 14px; border-radius:8px; cursor:pointer; font-size:0.85rem;
  }
  #pauseBtn:hover{background:var(--accent-dim);}
  #canvasHolder{position:relative;}
  canvas{background:#120a1c;border-radius:12px;display:block;cursor:pointer;}

  #countdownOverlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-size:4rem; font-weight:900; color:#fff; text-shadow:0 0 20px var(--accent);
    background:rgba(10,6,16,0.45); border-radius:12px; pointer-events:none;
  }

  #pauseOverlay, #endScreen{
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; color:#fff;
  }
  #pauseOverlay{position:absolute; inset:0; background:rgba(10,6,16,0.8); border-radius:12px;}
  #endScreen{background:var(--panel); padding:30px 40px; border-radius:16px; gap:10px;}
  #endScreen h2{color:var(--accent);}
  #endScreen .end-row{display:flex;gap:10px;}
  .ghost-btn{
    background:var(--panel2); color:var(--text); border:none;
    padding:10px; border-radius:10px; cursor:pointer; font-size:0.85rem;
  }
</style>
</head>
<body>

<h1>Tug of War</h1>

<div class="panel" id="setup">
  <div class="menu-art">
    <span>🔵</span><div class="rope-line"></div><span>🟣</span>
  </div>
  <div>
    <p class="row-label">Chọn chế độ</p>
    <div class="menu-grid" id="modeGroup">
      <button class="mode-tile tile-pvp active" data-val="pvp">
        <span class="tile-icon">🤝</span>
        <span class="tile-title">2 người</span>
        <span class="tile-sub">Cùng 1 máy — Space vs Click</span>
      </button>
      <button class="mode-tile tile-bot" data-val="bot">
        <span class="tile-icon">🤖</span>
        <span class="tile-title">Đấu Bot</span>
        <span class="tile-sub">Bot bấm theo nhịp ngẫu nhiên</span>
      </button>
    </div>
  </div>
  <button class="start-btn" id="startBtn">Bắt đầu</button>
  <p class="controls-hint">
    <b style="color:var(--p1)">Player 1:</b> nhấn phím <b>Space</b> liên tục để kéo<br>
    <b style="color:var(--p2)">Player 2:</b> click chuột trái liên tục để kéo<br>
    Giữ phím/giữ chuột không có tác dụng — phải nhấn từng nhịp. Esc để tạm dừng.
  </p>
</div>

<div id="gameWrap">
  <div id="hud">
    <div class="hud-side">
      <span class="hud-name" style="color:var(--p1)">P1 (Space)</span>
      <div class="power-bar"><div class="power-fill" id="p1Power" style="background:var(--p1)"></div></div>
    </div>
    <div id="hudCenter">40</div>
    <div class="hud-side right">
      <span class="hud-name" id="p2Label" style="color:var(--p2)">P2 (Click)</span>
      <div class="power-bar"><div class="power-fill" id="p2Power" style="background:var(--p2)"></div></div>
    </div>
    <button id="pauseBtn">Tạm dừng (Esc)</button>
  </div>
  <div id="canvasHolder">
    <canvas id="canvas" width="800" height="360"></canvas>
    <div id="countdownOverlay">3</div>
    <div id="pauseOverlay">
      <h3 style="font-size:1.3rem;">Tạm dừng</h3>
      <button class="start-btn" id="resumeBtn">Tiếp tục</button>
      <button class="ghost-btn" id="quitBtn" style="width:160px;">Thoát ra menu</button>
    </div>
  </div>
</div>

<div id="endScreen">
  <h2 id="endTitle"></h2>
  <p id="endSub" style="color:var(--muted);font-size:0.9rem;"></p>
  <div class="end-row">
    <button class="start-btn" id="retryBtn">Đấu lại</button>
    <button class="ghost-btn" id="toMenuBtn">Về menu</button>
  </div>
</div>

<script>
const setupPanel = document.getElementById("setup");
const gameWrap = document.getElementById("gameWrap");
const endScreen = document.getElementById("endScreen");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const countdownOverlay = document.getElementById("countdownOverlay");

let mode = "pvp";
document.getElementById("modeGroup").addEventListener("click", e => {
  const btn = e.target.closest(".mode-tile");
  if(!btn) return;
  mode = btn.dataset.val;
  [...e.currentTarget.children].forEach(b => b.classList.toggle("active", b===btn));
  document.getElementById("p2Label").textContent = mode==="bot" ? "Bot (CPU)" : "P2 (Click)";
});

// ---------------- sound ----------------
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
}
function tone(freq,dur,type="sine",vol=0.12,delay=0){
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.type=type; osc.frequency.value=freq;
  const t0=audioCtx.currentTime+delay;
  gain.gain.setValueAtTime(vol,t0);
  gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur);
}
function noiseBurst(dur,vol=0.15){
  if(!audioCtx) return;
  const bufferSize = audioCtx.sampleRate*dur;
  const buffer = audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*(1-i/bufferSize);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.value = vol;
  src.connect(gain); gain.connect(audioCtx.destination);
  src.start();
}
const sfx = {
  pull1: () => tone(220,0.06,"square",0.1),
  pull2: () => tone(300,0.06,"square",0.1),
  beep:  () => tone(500,0.1,"sine",0.12),
  go:    () => { tone(700,0.14,"triangle",0.15); tone(1000,0.12,"triangle",0.13,0.08); },
  win:   () => { tone(660,0.1,"triangle",0.14); tone(880,0.1,"triangle",0.14,0.1); tone(1100,0.16,"triangle",0.14,0.2); },
  lose:  () => { tone(440,0.16,"sawtooth",0.12); tone(260,0.26,"sawtooth",0.12,0.14); },
  pause: () => tone(320,0.08,"sine",0.1),
  resume:() => tone(460,0.08,"sine",0.1),
  snap:  () => { noiseBurst(0.2,0.2); tone(120,0.25,"sawtooth",0.15); },
};

// ---------------- state ----------------
const MAX_POWER = 100;
const PRESS_IMPULSE = 16;
const DECAY_PER_SEC = 55;
const PULL_SCALE = 0.000022;
const ROUND_TIME = 40;

let p1Power=0, p2Power=0, ropePos=0;
let timeLeft = ROUND_TIME, roundInterval=null;
let running=false, paused=false, countingDown=false, inputLocked=true;
let lastFrame=0;
let shake=0, particles=[];
let botTimer=0;
let spaceHeld=false;

function resetRound(){
  p1Power=0; p2Power=0; ropePos=0;
  timeLeft=ROUND_TIME;
  shake=0; particles=[];
  botTimer = 150+Math.random()*300;
  inputLocked = true;
}

function press(side){
  if(inputLocked || !running || paused) return;
  if(side===1){ p1Power = Math.min(MAX_POWER, p1Power+PRESS_IMPULSE); sfx.pull1(); spawnDust(-1); }
  else { p2Power = Math.min(MAX_POWER, p2Power+PRESS_IMPULSE); sfx.pull2(); spawnDust(1); }
}

window.addEventListener("keydown", e => {
  if(e.code==="Escape"){ togglePause(); return; }
  if(e.code==="Space"){
    e.preventDefault();
    if(!spaceHeld){ spaceHeld=true; press(1); }
  }
});
window.addEventListener("keyup", e => { if(e.code==="Space") spaceHeld=false; });
canvas.addEventListener("mousedown", e => {
  if(e.button===0 && mode==="pvp") press(2);
});

function spawnDust(dir){
  const x = canvas.width/2 + ropePos*220 + dir*60;
  for(let i=0;i<6;i++){
    particles.push({ x:x+(Math.random()-0.5)*14, y:260+(Math.random()-0.5)*8,
      vx:dir*-0.3+(Math.random()-0.5)*0.6, vy:-0.4-Math.random()*0.6,
      life:1, s:2+Math.random()*3, color:"rgba(200,180,150,0.6)" });
  }
}
function spawnSnap(x){
  for(let i=0;i<24;i++){
    const ang=Math.random()*Math.PI*2, spd=1.5+Math.random()*4;
    particles.push({ x, y:180, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
      life:1, s:2+Math.random()*3, color: Math.random()<0.5?"#ffd166":"#fff" });
  }
}

// ---------------- update / draw ----------------
function update(dt){
  if(inputLocked) return;

  // decay
  const decay = DECAY_PER_SEC*dt/1000;
  p1Power = Math.max(0, p1Power-decay);
  p2Power = Math.max(0, p2Power-decay);

  // bot presses (random rhythm)
  if(mode==="bot"){
    botTimer -= dt;
    if(botTimer<=0){
      press(2);
      botTimer = 70 + Math.random()*260; // random tempo — can mash nearly as fast as a human now
    }
  }

  // P1 stands on the left (negative side), P2 on the right (positive side) —
  // the stronger puller drags the rope toward their own zone.
  const net = p1Power - p2Power;
  ropePos -= net*PULL_SCALE*dt;
  ropePos = Math.max(-1, Math.min(1, ropePos));

  particles.forEach(p => { p.x+=p.vx*dt*0.06; p.y+=p.vy*dt*0.06; p.life-=dt*0.0015; });
  particles = particles.filter(p => p.life>0);
  if(shake>0) shake = Math.max(0, shake-dt*0.1);

  if(ropePos<=-1){ endRound(1); }
  else if(ropePos>=1){ endRound(2); }
}

let crowdDots = null;
function makeCrowd(){
  crowdDots = [];
  for(let row=0; row<2; row++){
    for(let x=10; x<canvas.width-10; x+=16){
      crowdDots.push({ x: x+(Math.random()-0.5)*6, y: 18+row*13+(Math.random()-0.5)*4,
        c: Math.random()<0.5 ? "rgba(77,166,255,0.5)" : "rgba(255,47,214,0.5)",
        ph: Math.random()*Math.PI*2 });
    }
  }
}

function draw(){
  if(!crowdDots) makeCrowd();
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  // sky
  const g = ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,"#140a24"); g.addColorStop(0.5,"#241433"); g.addColorStop(1,"#2e1c3f");
  ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);

  // stadium light glow, pulsing gently
  const pulse = 0.5+0.5*Math.sin(performance.now()*0.0015);
  [100,canvas.width-100].forEach(lx => {
    const rg = ctx.createRadialGradient(lx,-20,10,lx,-20,180);
    rg.addColorStop(0, `rgba(255,255,255,${0.08+0.04*pulse})`);
    rg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = rg;
    ctx.fillRect(0,0,canvas.width,220);
  });

  // crowd silhouette strip
  crowdDots.forEach(d => {
    const bob = Math.sin(performance.now()*0.003+d.ph)*2;
    ctx.fillStyle = d.c;
    ctx.beginPath(); ctx.arc(d.x, d.y+bob, 4, 0, Math.PI*2); ctx.fill();
  });

  // ground (grass left of pit, dirt pit in middle, grass right)
  ctx.fillStyle = "#1f3a28";
  ctx.fillRect(0,250,canvas.width,canvas.height-250);
  const pit = ctx.createLinearGradient(0,250,0,canvas.height);
  pit.addColorStop(0,"#4a3420"); pit.addColorStop(1,"#2b2014");
  ctx.fillStyle = pit;
  ctx.fillRect(canvas.width/2-170,250,340,canvas.height-250);
  // ground texture streaks
  ctx.strokeStyle="rgba(255,255,255,0.04)"; ctx.lineWidth=1;
  for(let x=0;x<canvas.width;x+=18){
    ctx.beginPath(); ctx.moveTo(x,250); ctx.lineTo(x+6,canvas.height); ctx.stroke();
  }

  // win zones + labels
  ctx.fillStyle = "rgba(77,166,255,0.08)";
  ctx.fillRect(0,0,160,250);
  ctx.fillStyle = "rgba(255,47,214,0.08)";
  ctx.fillRect(canvas.width-160,0,160,250);
  ctx.strokeStyle = "rgba(77,166,255,0.6)"; ctx.setLineDash([6,6]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(160,0); ctx.lineTo(160,250); ctx.stroke();
  ctx.strokeStyle = "rgba(255,47,214,0.6)";
  ctx.beginPath(); ctx.moveTo(canvas.width-160,0); ctx.lineTo(canvas.width-160,250); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font="700 12px 'Segoe UI'"; ctx.textAlign="center";
  ctx.fillStyle="rgba(77,166,255,0.8)"; ctx.fillText("ĐỘI XANH", 80, 236);
  ctx.fillStyle="rgba(255,47,214,0.8)"; ctx.fillText(mode==="bot"?"ĐỘI BOT":"ĐỘI HỒNG", canvas.width-80, 236);

  // flags at each end
  drawFlag(50, "#4da6ff");
  drawFlag(canvas.width-50, "#ff2fd6");

  const centerX = canvas.width/2 + ropePos*220;

  // rope
  ctx.strokeStyle = "#caa968";
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(60,190); ctx.lineTo(canvas.width-60,190); ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth=2;
  for(let x=60;x<canvas.width-60;x+=14){
    ctx.beginPath(); ctx.moveTo(x,185); ctx.lineTo(x+7,195); ctx.stroke();
  }
  // center knot / marker with glow
  ctx.save();
  ctx.shadowColor = "#ff3d5c"; ctx.shadowBlur = 14;
  ctx.fillStyle = "#ff3d5c";
  ctx.beginPath(); ctx.arc(centerX,190,10,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.strokeStyle="#fff"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(centerX,190,10,0,Math.PI*2); ctx.stroke();

  // particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(p.life,0);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // characters (simple leaning figures)
  drawPlayer(centerX-170, 1, p1Power);
  drawPlayer(centerX+170, 2, p2Power);

  ctx.restore();
}

function drawFlag(x,color){
  ctx.save();
  ctx.strokeStyle="#9a8a7a"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x,250); ctx.lineTo(x,160); ctx.stroke();
  const wave = Math.sin(performance.now()*0.004)*4;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x,160);
  ctx.quadraticCurveTo(x+22+wave,166,x+30,160);
  ctx.quadraticCurveTo(x+22+wave,178,x,184);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPlayer(x,side,power){
  const lean = (power/MAX_POWER)*14 * (side===1?1:-1);
  ctx.save();
  ctx.translate(x,232);
  ctx.rotate(lean*Math.PI/180*0.3);
  const color = side===1 ? "#4da6ff" : "#ff2fd6";
  // legs
  ctx.strokeStyle = color; ctx.lineWidth=6; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-10,30); ctx.lineTo(0,0); ctx.lineTo(10,30); ctx.stroke();
  // body
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-34); ctx.stroke();
  // arms toward rope
  ctx.beginPath();
  ctx.moveTo(0,-26); ctx.lineTo(side===1?26:-26,-42-lean*0.4);
  ctx.stroke();
  // head
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0,-44,9,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function loop(ts){
  if(!running||paused) return;
  const dt = lastFrame ? ts-lastFrame : 16;
  lastFrame = ts;
  update(dt);
  draw();
  updateHud();
  requestAnimationFrame(loop);
}

function updateHud(){
  document.getElementById("p1Power").style.width = p1Power+"%";
  document.getElementById("p2Power").style.width = p2Power+"%";
  document.getElementById("hudCenter").textContent = timeLeft;
}

function startCountdown(){
  countingDown = true;
  const seq = ["3","2","1","Kéo!"];
  let i=0;
  countdownOverlay.style.display="flex";
  countdownOverlay.textContent = seq[0];
  sfx.beep();
  const iv = setInterval(() => {
    i++;
    if(i<seq.length){
      countdownOverlay.textContent = seq[i];
      i===seq.length-1 ? sfx.go() : sfx.beep();
    } else {
      clearInterval(iv);
      countdownOverlay.style.display="none";
      countingDown=false;
      inputLocked=false;
      startRoundTimer();
    }
  }, 700);
}

function startRoundTimer(){
  clearInterval(roundInterval);
  roundInterval = setInterval(() => {
    if(paused || !running || inputLocked) return;
    timeLeft--;
    if(timeLeft<=0){
      if(ropePos<0) endRound(1);
      else if(ropePos>0) endRound(2);
      else endRound(0);
    }
  }, 1000);
}

function endRound(winnerSide){
  inputLocked = true;
  running = false; paused=false;
  clearInterval(roundInterval);
  spawnSnap(canvas.width/2 + ropePos*220);
  shake = 14;
  sfx.snap();
  setTimeout(() => {
    gameWrap.style.display="none";
    endScreen.style.display="flex";
    if(winnerSide===0){
      document.getElementById("endTitle").textContent = "Hòa!";
      document.getElementById("endSub").textContent = "Hết giờ mà dây vẫn ở giữa.";
      sfx.lose();
    } else {
      const name = winnerSide===1 ? "Player 1" : (mode==="bot" ? "Bot" : "Player 2");
      document.getElementById("endTitle").textContent = name + " thắng!";
      document.getElementById("endSub").textContent = winnerSide===1
        ? "Kéo được dây về phía mình."
        : (mode==="bot" ? "Bot kéo nhanh hơn — thử lại nào." : "Player 2 kéo mạnh hơn.");
      if(mode==="bot"){
        winnerSide===1 ? sfx.win() : sfx.lose();
      } else {
        sfx.win();
      }
    }
  }, 260);
}

function togglePause(){
  if(!running) return;
  paused=!paused;
  document.getElementById("pauseOverlay").style.display = paused?"flex":"none";
  document.getElementById("pauseBtn").textContent = paused?"Tiếp tục (Esc)":"Tạm dừng (Esc)";
  sfx[paused?"pause":"resume"]();
  if(!paused){ lastFrame=0; requestAnimationFrame(loop); }
}
document.getElementById("pauseBtn").addEventListener("click", togglePause);
document.getElementById("resumeBtn").addEventListener("click", togglePause);

function quitToMenu(){
  running=false; paused=false;
  clearInterval(roundInterval);
  document.getElementById("pauseOverlay").style.display="none";
  gameWrap.style.display="none";
  endScreen.style.display="none";
  setupPanel.style.display="flex";
}
document.getElementById("quitBtn").addEventListener("click", quitToMenu);
document.getElementById("toMenuBtn").addEventListener("click", quitToMenu);

function startGame(){
  ensureAudio();
  setupPanel.style.display="none";
  endScreen.style.display="none";
  gameWrap.style.display="flex";
  document.getElementById("pauseOverlay").style.display="none";
  document.getElementById("pauseBtn").textContent="Tạm dừng (Esc)";
  resetRound();
  running=true; paused=false; lastFrame=0;
  requestAnimationFrame(loop);
  startCountdown();
}
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("retryBtn").addEventListener("click", startGame);
</script>
